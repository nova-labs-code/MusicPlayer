<!DOCTYPE html>
<html>
<head>
  <title>Artist Hub</title>

  <style id="theme">
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      transition: 0.3s;
    }

    .layout {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #141414;
      padding: 10px;
      overflow-y: auto;
    }

    .artist {
      padding: 10px;
      margin: 6px 0;
      background: #1c1c1c;
      cursor: pointer;
      border-radius: 6px;
    }

    .artist:hover {
      background: #2a2a2a;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .song {
      padding: 10px;
      margin: 6px 0;
      background: #1c1c1c;
      border-radius: 6px;
      cursor: pointer;
    }

    .song:hover {
      background: #2a2a2a;
    }
  </style>
</head>

<body>

<div class="layout">

  <!-- 🎤 ARTIST LIST -->
  <div class="sidebar" id="artistList"></div>

  <!-- 🎵 SONG AREA -->
  <div class="main">
    <h1 id="artistName">Select an Artist</h1>
    <div id="songs"></div>
  </div>

</div>

<script>
const DEFAULT_IMAGE =
  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAQAAAAAYLlVAAA...";

function resolveImage(img) {
  return (!img || img.trim() === "") ? DEFAULT_IMAGE : img;
}

// -------------------------
// 🎤 ARTIST LIST (manual or later auto-scan)
// -------------------------
const artists = ["Alex Warren", "NeonEcho"];

const artistList = document.getElementById("artistList");

artists.forEach(name => {
  const div = document.createElement("div");
  div.className = "artist";
  div.innerText = name;

  div.onclick = () => loadArtist(name);

  artistList.appendChild(div);
});

// -------------------------
// 🎧 LOAD ARTIST CONFIG
// -------------------------
function loadArtist(name) {
  fetch(`${name}/config.json`)
    .then(res => res.json())
    .then(data => {

      // 🎨 theme
      if (data.theme) {
        document.body.style.background = data.theme.bg || "#0f0f0f";
        document.body.style.color = data.theme.accent || "#fff";
      }

      document.getElementById("artistName").innerText = data.artist;

      const songsDiv = document.getElementById("songs");
      songsDiv.innerHTML = "";

      data.songs.forEach(song => {
        const div = document.createElement("div");
        div.className = "song";

        div.innerText = song.title;

        div.onclick = () => {
          const audio = new Audio(`${name}/${song.file}`);
          audio.play();
        };

        songsDiv.appendChild(div);
      });

    });
}
</script>

</body>
</html>
