<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#search {
  width: 60%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
}

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: #1a1a1a;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
}

.card div {
  padding: 10px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h2>🎧 Music Hub</h2>
  <input id="search" placeholder="Search artists or songs...">
</header>

<div id="grid"></div>

<script>
const grid = document.getElementById("grid");
const search = document.getElementById("search");

let artists = [];
let cache = new Map();
let allSongs = [];

/* =========================
   LOAD ARTISTS
========================= */

fetch("artist.json")
  .then(r => r.json())
  .then(async (list) => {

    artists = list;

    for (const name of list) {

      const res = await fetch(`./Artist/${name}/config.json`);
      const data = await res.json();

      cache.set(name, data);

      /* flatten songs for search */
      data.songs.forEach((s, i) => {
        allSongs.push({
          title: s.title,
          artist: data.artist,
          artistKey: name,
          id: i
        });
      });

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img src="./Artist/${name}/${data.image}">
        <div>${data.artist}</div>
      `;

      card.onclick = () => {
        location.href = `?name=${name}`;
      };

      grid.appendChild(card);
    }
  });

/* =========================
   SEARCH (ARTISTS ONLY VIEW)
========================= */

search.addEventListener("input", e => {

  const q = e.target.value.toLowerCase();

  grid.innerHTML = "";

  /* ARTIST FILTER */
  const filteredArtists = artists.filter(a =>
    a.toLowerCase().includes(q)
  );

  filteredArtists.forEach(name => {

    const data = cache.get(name);
    if (!data) return;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="./Artist/${name}/${data.image}">
      <div>${data.artist}</div>
    `;

    card.onclick = () => {
      location.href = `?name=${name}`;
    };

    grid.appendChild(card);
  });

  /* OPTIONAL: if you ever want song search on home */
  const songMatches = allSongs.filter(s =>
    s.title.toLowerCase().includes(q)
  );

  if(q.length > 0 && songMatches.length > 0){

    songMatches.forEach(s => {

      const card = document.createElement("div");
      card.className = "card";

      const data = cache.get(s.artistKey);

      card.innerHTML = `
        <img src="./Artist/${s.artistKey}/${data.image}">
        <div>${s.title}</div>
      `;

      card.onclick = () => {
        location.href = `?name=${s.artistKey}&song=song${s.id + 1}`;
      };

      grid.appendChild(card);
    });
  }

});
</script>

</body>
</html>
