<!DOCTYPE html>
<html>
<head>
  <title>MusicPlayer</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<h1 id="title">🎧 MusicPlayer</h1>

<div id="searchBox">
  <input id="searchInput" placeholder="Search artists or songs...">
</div>

<!-- 🎯 CATEGORY SWITCH -->
<div id="categories">
  <button class="cat active" data-type="all">All</button>
  <button class="cat" data-type="artists">Artists</button>
  <button class="cat" data-type="music">Music</button>
</div>

<div id="grid" class="grid"></div>
<div id="results" class="grid"></div>

<script src="./main.js"></script>

</body>
</html>
