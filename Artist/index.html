<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<title>MusicPlayer</title>

<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#111111">

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
/>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
/>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>

</head>

<body>

<!-- =========================
     NAVIGATION
========================= -->

<nav id="nav">

  <button
    onclick="goHome()"
    aria-label="Home"
  >
    🏠 Home
  </button>

  <button
    id="backBtn"
    onclick="goBack()"
    aria-label="Back to Artists"
  >
    🎤 Artists
  </button>

</nav>

<!-- =========================
     TITLE
========================= -->

<h1 id="title">
  Artists
</h1>

<!-- =========================
     SEARCH
========================= -->

<input
  id="songSearch"
  type="text"
  placeholder="Search songs..."
  autocomplete="off"
/>

<!-- =========================
     ARTIST GRID
========================= -->

<div
  id="grid"
  class="grid"
></div>

<!-- =========================
     SONG GRID
========================= -->

<div
  id="songs"
  class="songs"
></div>

<!-- =========================
     PLAYER
========================= -->

<div
  class="player"
  id="player"
>

  <!-- =========================
       MINI PLAYER
  ========================= -->

  <div class="ui">

    <img
      id="cover"
      alt="Album Cover"
      draggable="false"
    >

    <div class="song-info">

      <div id="now">
        Not Playing
      </div>

      <div
        class="progress-container"
        id="barMini"
      >
        <div
          class="progress"
          id="progMini"
        ></div>
      </div>

    </div>

    <!-- CONTROLS -->

    <button
      onclick="prevSong()"
      aria-label="Previous Song"
    >
      ⏮
    </button>

    <button
      onclick="togglePlay()"
      aria-label="Play or Pause"
    >
      ▶
    </button>

    <button
      onclick="nextSong()"
      aria-label="Next Song"
    >
      ⏭
    </button>

    <button
      onclick="toggleShuffle()"
      id="shuffleBtn"
      aria-label="Toggle Shuffle"
      title="Shuffle"
    >
      🔀
    </button>

    <button
      onclick="toggleLoop()"
      id="loopBtn"
      aria-label="Toggle Loop"
      title="Loop"
    >
      🔁
    </button>

    <button
      onclick="toggleFullscreen()"
      aria-label="Fullscreen Player"
      title="Fullscreen"
    >
      ⛶
    </button>

    <div
      class="time"
      id="time"
    >
      0:00
    </div>

  </div>

  <!-- =========================
       FULLSCREEN PLAYER
  ========================= -->

  <div class="fullscreen-ui">

    <img
      id="coverBig"
      alt="Album Cover Large"
      draggable="false"
    >

    <div id="songTitle">
      Not Playing
    </div>

    <div id="artistName">
      Artist
    </div>

    <div id="loopState">
      Loop: Off
    </div>

    <!-- FULL CONTROLS -->

    <div class="controls">

      <button
        onclick="prevSong()"
        aria-label="Previous Song"
      >
        ⏮
      </button>

      <button
        onclick="togglePlay()"
        aria-label="Play or Pause"
      >
        ▶
      </button>

      <button
        onclick="nextSong()"
        aria-label="Next Song"
      >
        ⏭
      </button>

      <button
        onclick="toggleShuffle()"
        id="shuffleBtnFS"
        aria-label="Toggle Shuffle"
      >
        🔀
      </button>

      <button
        onclick="toggleLoop()"
        id="loopBtnFS"
        aria-label="Toggle Loop"
      >
        🔁
      </button>

      <button
        onclick="toggleFullscreen()"
        aria-label="Exit Fullscreen"
      >
        ⛶
      </button>

    </div>

    <!-- FULLSCREEN PROGRESS -->

    <div
      class="full-progress"
      id="barFull"
    >
      <div
        class="progress"
        id="progFull"
      ></div>
    </div>

  </div>

</div>

<!-- =========================
     SCRIPT
========================= -->

<script src="main.js"></script>

</body>
</html>
