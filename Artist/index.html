<!DOCTYPE html>
<html>
<head>
  <title>MusicPlayer</title>

  <style>
    :root {
      --accent: #ffffff;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    h1 {
      padding: 20px;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 8px;
    }

    .songs {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .song {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }

    .song img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 8px;
    }

    /* PLAYER */
    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      display: none;
      z-index: 999;
    }

    /* MINI */
    .mini-ui {
      display: flex;
      align-items: center;
      padding: 8px;
      gap: 10px;
    }

    #cover-mini {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
    }

    .controls button {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .progress-container {
      flex: 1;
      height: 4px;
      background: #333;
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
    }

    .time {
      font-size: 12px;
      width: 70px;
      text-align: right;
    }

    /* FULLSCREEN */
    .player.fullscreen {
      top: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1a1a, #000);
    }

    .fullscreen-ui {
      display: none;
      height: 100%;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 30px;
      box-sizing: border-box;
    }

    .player.fullscreen .mini-ui {
      display: none;
    }

    .player.fullscreen .fullscreen-ui {
      display: flex;
    }

    #cover-full {
      width: 260px;
      height: 260px;
      border-radius: 18px;
      object-fit: cover;
    }

    #fullTitle {
      font-size: 22px;
    }

    #fullArtist {
      opacity: 0.7;
    }

    .full-controls button {
      font-size: 26px;
      margin: 0 10px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    /* slim fullscreen bar */
    .progress-container.big {
      width: min(700px, 85vw);
      height: 3px;
    }

    video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>
<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<div class="player" id="player">

  <div class="mini-ui">
    <img id="cover-mini">

    <div style="flex:1">
      <div id="nowPlaying">Not Playing</div>

      <div class="progress-container" id="progressContainer">
        <div class="progress" id="progress"></div>
      </div>
    </div>

    <div class="controls">
      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="nextSong()">⏭</button>
      <button onclick="togglePiP()">🪟</button>
      <button onclick="toggleFullscreen()">⛶</button>
    </div>

    <div class="time" id="time">0:00</div>
  </div>

  <div class="fullscreen-ui">
    <img id="cover-full">
    <div id="fullTitle"></div>
    <div id="fullArtist"></div>

    <div class="full-controls">
      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="nextSong()">⏭</button>
    </div>

    <button onclick="exitFullscreen()">✕ Exit</button>

    <div class="progress-container big" id="progressContainerFull">
      <div class="progress" id="progressFull"></div>
    </div>

    <div class="time" id="timeFull">0:00</div>
  </div>
</div>

<!-- PiP video engine -->
<video id="pipVideo"></video>

<script>
let audio = new Audio();
let pipVideo = document.getElementById("pipVideo");

let currentList = [];
let currentIndex = 0;
let currentArtist = "";
let isPlaying = false;

/* TITLE */
function setTitle(song) {
  if (song) {
    document.title = `${song} - MusicPlayer`;
  } else if (currentArtist) {
    document.title = `${currentArtist} - MusicPlayer`;
  } else {
    document.title = "MusicPlayer";
  }
}

/* PLAY */
function playSong(list, index, artist) {
  currentList = list;
  currentIndex = index;
  currentArtist = artist;

  const song = list[index];

  audio.src = `./${artist}/${song.file}`;
  pipVideo.src = audio.src;

  audio.play();
  pipVideo.play();

  isPlaying = true;

  document.getElementById("player").style.display = "block";

  document.getElementById("nowPlaying").innerText = song.title;
  document.getElementById("cover-mini").src = `./${artist}/${song.image}`;
  document.getElementById("cover-full").src = `./${artist}/${song.image}`;

  document.getElementById("fullTitle").innerText = song.title;
  document.getElementById("fullArtist").innerText = artist;

  setTitle(song.title);
}

/* CONTROLS */
function togglePlay() {
  if (audio.paused) {
    audio.play();
    pipVideo.play();
    isPlaying = true;
  } else {
    audio.pause();
    pipVideo.pause();
    isPlaying = false;
  }
}

function nextSong() {
  if (currentIndex < currentList.length - 1) {
    playSong(currentList, currentIndex + 1, currentArtist);
  }
}

function prevSong() {
  if (audio.currentTime > 5) {
    audio.currentTime = 0;
    pipVideo.currentTime = 0;
    return;
  }
  if (currentIndex > 0) {
    playSong(currentList, currentIndex - 1, currentArtist);
  }
}

/* FULLSCREEN */
function toggleFullscreen() {
  const player = document.getElementById("player");

  if (!player.classList.contains("fullscreen")) {
    player.classList.add("fullscreen");
    document.documentElement.requestFullscreen?.();
  } else {
    exitFullscreen();
  }
}

function exitFullscreen() {
  const player = document.getElementById("player");
  player.classList.remove("fullscreen");
  document.exitFullscreen?.();
}

/* PiP FIXED */
async function togglePiP() {
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
    } else {
      pipVideo.src = audio.src;
      pipVideo.currentTime = audio.currentTime;
      await pipVideo.play();
      await pipVideo.requestPictureInPicture();
    }
  } catch (e) {}
}

/* SYNC */
audio.addEventListener("timeupdate", () => {
  pipVideo.currentTime = audio.currentTime;

  const pct = (audio.currentTime / audio.duration) * 100;

  document.getElementById("progress").style.width = pct + "%";
  document.getElementById("progressFull").style.width = pct + "%";

  const m = Math.floor(audio.currentTime / 60);
  const s = Math.floor(audio.currentTime % 60);
  const t = `${m}:${s < 10 ? "0" : ""}${s}`;

  document.getElementById("time").innerText = t;
  document.getElementById("timeFull").innerText = t;
});

/* SEEK */
function seek(e, bar) {
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
  pipVideo.currentTime = audio.currentTime;
}

progressContainer.onclick = e => seek(e, progressContainer);
progressContainerFull.onclick = e => seek(e, progressContainerFull);

/* ROUTING */
const params = new URLSearchParams(location.search);
const artistName = params.get("name");

/* HOME */
if (!artistName) {
  setTitle();

  fetch("artist.json")
    .then(r => r.json())
    .then(list => {
      list.forEach(name => {
        fetch(`./${name}/config.json`)
          .then(r => r.json())
          .then(data => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <img src="./${name}/${data.image}">
              <div>${data.artist}</div>
            `;
            card.onclick = () => location.href = `?name=${name}`;
            grid.appendChild(card);
          });
      });
    });
}

/* ARTIST */
else {
  document.getElementById("grid").style.display = "none";
  document.getElementById("songs").style.display = "grid";

  fetch(`./${artistName}/config.json`)
    .then(r => r.json())
    .then(data => {
      setTitle(null);

      document.getElementById("title").innerText = data.artist;

      data.songs.forEach((song, i) => {
        const el = document.createElement("div");
        el.className = "song";
        el.innerHTML = `
          <img src="./${artistName}/${song.image}">
          <div>${song.title}</div>
        `;
        el.onclick = () => playSong(data.songs, i, artistName);
        songs.appendChild(el);
      });
    });
}
</script>

</body>
</html>
