<!DOCTYPE html>
<html>
<head>
<title>MusicPlayer</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

/* GRID */
.grid,.songs{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:16px;
  padding:20px;
}

.card,.song{
  background:#1c1c1c;
  border-radius:10px;
  padding:10px;
  text-align:center;
  cursor:pointer;
}

img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

/* PLAYER */
.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#181818;
  display:none;
  z-index:999;
}

/* MINI UI */
.ui{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
}

#cover{
  width:44px;
  height:44px;
  border-radius:6px;
}

/* buttons */
button{
  background:none;
  border:none;
  color:#666;
  font-size:18px;
  cursor:pointer;
}

button.active{
  color:white;
  text-shadow:0 0 8px white;
}

/* progress */
.progress-container{
  flex:1;
  height:4px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  cursor:pointer;
}

.progress{
  height:100%;
  width:0%;
  background:white;
}

.time{
  width:70px;
  font-size:12px;
  text-align:right;
}

/* FULLSCREEN */
.player.fullscreen{
  top:0;
  height:100vh;
  background:radial-gradient(circle,#1a1a1a,#000);
}

.player.fullscreen .ui{
  display:none;
}

/* FULLSCREEN LAYOUT */
.fullscreen-ui{
  display:none;
  height:100%;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:30px;
}

.player.fullscreen .fullscreen-ui{
  display:flex;
}

#coverBig{
  width:260px;
  height:260px;
  border-radius:18px;
}

/* controls */
.controls{
  display:flex;
  gap:15px;
  align-items:center;
}

.controls button{
  font-size:28px;
}

/* full progress */
.full-progress{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,85vw);
  height:4px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  cursor:pointer;
}

.full-progress .progress{
  height:100%;
  width:0%;
  background:white;
}
</style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>

<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<div class="player" id="player">

  <!-- MINI -->
  <div class="ui">

    <img id="cover">

    <div style="flex:1">
      <div id="now">Not Playing</div>

      <div class="progress-container" id="barMini">
        <div class="progress" id="progMini"></div>
      </div>
    </div>

    <button onclick="prevSong()">⏮</button>
    <button onclick="togglePlay()">⏯</button>
    <button onclick="nextSong()">⏭</button>

    <button id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
    <button id="loopBtn" onclick="toggleLoop()">🔁</button>
    <button onclick="toggleFullscreen()">⛶</button>

    <div class="time" id="time">0:00</div>

  </div>

  <!-- FULLSCREEN -->
  <div class="fullscreen-ui">

    <img id="coverBig">

    <div id="songTitle"></div>
    <div id="artistName"></div>

    <div class="controls">
      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="nextSong()">⏭</button>
      <button id="shuffleBtnFS" onclick="toggleShuffle()">🔀</button>
      <button id="loopBtnFS" onclick="toggleLoop()">🔁</button>
      <button onclick="toggleFullscreen()">⛶</button>
    </div>

    <div class="full-progress" id="barFull">
      <div class="progress" id="progFull"></div>
    </div>

  </div>

</div>

<script>

let audio = new Audio();
let list=[], index=0, artist="";

let shuffle=false;
let loop=false;

/* TITLE */
function setPageTitle(text){
  document.getElementById("title").innerText=text;
  document.title=text+" - MusicPlayer";
}

/* BUTTON UI UPDATE */
function updateButtons(){
  shuffleBtn.classList.toggle("active", shuffle);
  loopBtn.classList.toggle("active", loop);

  shuffleBtnFS.classList.toggle("active", shuffle);
  loopBtnFS.classList.toggle("active", loop);
}

/* PLAY */
function playSong(l,i,a){
  list=l;
  index=i;
  artist=a;

  let s=l[i];

  audio.src=`./${a}/${s.file}`;
  audio.play();

  player.style.display="block";

  now.innerText=s.title;
  cover.src=`./${a}/${s.image}`;
  coverBig.src=`./${a}/${s.image}`;

  songTitle.innerText=s.title;
  artistName.innerText=a;

  document.title=`${s.title} - MusicPlayer`;

  updateButtons();
}

/* PLAY/PAUSE */
function togglePlay(){
  audio.paused ? audio.play() : audio.pause();
}

/* SHUFFLE */
function toggleShuffle(){
  shuffle=!shuffle;
  updateButtons();
}

/* LOOP */
function toggleLoop(){
  loop=!loop;
  updateButtons();
}

/* NEXT */
function nextSong(){

  if(shuffle){
    let newIndex;
    do{
      newIndex=Math.floor(Math.random()*list.length);
    }while(list.length>1 && newIndex===index);

    return playSong(list,newIndex,artist);
  }

  if(index<list.length-1){
    playSong(list,index+1,artist);
  }else if(loop){
    playSong(list,0,artist);
  }
}

/* PREV */
function prevSong(){
  if(index>0){
    playSong(list,index-1,artist);
  }
}

/* AUTO LOOP CURRENT */
audio.addEventListener("ended",()=>{
  if(loop){
    audio.currentTime=0;
    audio.play();
  }else{
    nextSong();
  }
});

/* FULLSCREEN */
function toggleFullscreen(){
  let p=player;

  if(!p.classList.contains("fullscreen")){
    p.classList.add("fullscreen");
    document.documentElement.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
}

/* FIX REAL EXIT */
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement){
    player.classList.remove("fullscreen");
  }
});

/* SYNC */
audio.addEventListener("timeupdate",()=>{

  let pct=(audio.currentTime/audio.duration)*100;

  progMini.style.width=pct+"%";
  progFull.style.width=pct+"%";

  let m=Math.floor(audio.currentTime/60);
  let s=Math.floor(audio.currentTime%60);

  time.innerText=`${m}:${s<10?"0":""}${s}`;
});

/* SEEK */
barMini.onclick=e=>{
  let r=barMini.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
};

barFull.onclick=e=>{
  let r=barFull.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
};

/* ROUTING */
const params=new URLSearchParams(location.search);
const artistName=params.get("name");

/* HOME */
if(!artistName){

  setPageTitle("🎧 Artists");

  fetch("artist.json")
    .then(r=>r.json())
    .then(artists=>{

      artists.forEach(name=>{

        fetch(`./${name}/config.json`)
          .then(r=>r.json())
          .then(data=>{

            let card=document.createElement("div");
            card.className="card";

            card.innerHTML=`
              <img src="./${name}/${data.image}">
              <div>${data.artist}</div>
            `;

            card.onclick=()=>location.href=`?name=${name}`;

            grid.appendChild(card);
          });

      });

    });

}

/* ARTIST */
else{

  grid.style.display="none";
  songs.style.display="grid";

  fetch(`./${artistName}/config.json`)
    .then(r=>r.json())
    .then(data=>{

      setPageTitle(data.artist);

      data.songs.forEach((s,i)=>{

        let el=document.createElement("div");
        el.className="song";

        el.innerHTML=`
          <img src="./${artistName}/${s.image}">
          <div>${s.title}</div>
        `;

        el.onclick=()=>playSong(data.songs,i,artistName);

        songs.appendChild(el);
      });

    });

}

</script>

</body>
</html>
