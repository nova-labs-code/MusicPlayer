<!DOCTYPE html>
<html>
<head>
  <title>Artist Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    h1 {
      padding: 20px;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.04);
      background: #2a2a2a;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .name {
      margin-top: 8px;
    }

    /* 🎤 artist view */
    .songs {
      padding: 20px;
    }

    .song {
      padding: 10px;
      margin: 6px 0;
      background: #1c1c1c;
      border-radius: 8px;
      cursor: pointer;
    }

    .song:hover {
      background: #2a2a2a;
    }
  </style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>

<div id="grid" class="grid"></div>
<div id="songs" class="songs" style="display:none;"></div>

<script>
const DEFAULT_IMAGE =
  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAQAAAAAYLlVAAA...";

function resolveImage(img) {
  return (!img || img.trim() === "") ? DEFAULT_IMAGE : img;
}

// -------------------------
// 📌 GET URL PARAM
// -------------------------
const params = new URLSearchParams(window.location.search);
const artistName = params.get("Name");

// -------------------------
// 🏠 GRID MODE
// -------------------------
if (!artistName) {

  const artists = ["Alex Warren", "NeonEcho"];
  const grid = document.getElementById("grid");

  artists.forEach(name => {

    fetch(`${name}/config.json`)
      .then(res => res.json())
      .then(data => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${resolveImage(data.image)}">
          <div class="name">${data.artist}</div>
        `;

        card.onclick = () => {
          window.location.href = `?Name=${encodeURIComponent(name)}`;
        };

        grid.appendChild(card);
      });

  });

}

// -------------------------
// 🎤 ARTIST MODE
// -------------------------
else {

  document.getElementById("grid").style.display = "none";
  document.getElementById("songs").style.display = "block";

  fetch(`${artistName}/config.json`)
    .then(res => res.json())
    .then(data => {

      document.getElementById("title").innerText = data.artist;

      const songsDiv = document.getElementById("songs");

      data.songs.forEach(song => {

        const div = document.createElement("div");
        div.className = "song";
        div.innerText = song.title;

        div.onclick = () => {
          new Audio(`${artistName}/${song.file}`).play();
        };

        songsDiv.appendChild(div);

      });

    });

}
</script>

</body>
</html>
