<!DOCTYPE html>
<html>
<head>
<title>MusicPlayer</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

h1{
  padding:20px;
  margin:0;
}

/* GRID */
.grid,.songs{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:16px;
  padding:20px;
}

.card,.song{
  background:#1c1c1c;
  border-radius:10px;
  padding:10px;
  text-align:center;
  cursor:pointer;
}

img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

/* PLAYER (ONLY MINI BAR) */
.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#181818;
  display:none;
  z-index:999;
}

/* MINI UI */
.ui{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
}

#cover{
  width:44px;
  height:44px;
  border-radius:6px;
}

/* controls */
button{
  background:none;
  border:none;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* MINI PROGRESS BAR ONLY */
.progress-container{
  flex:1;
  height:4px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  cursor:pointer;
}

.progress{
  height:100%;
  width:0%;
  background:white;
}

.time{
  width:70px;
  font-size:12px;
  text-align:right;
}
</style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>

<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<div class="player" id="player">

  <div class="ui">

    <img id="cover">

    <div style="flex:1">
      <div id="now">Not Playing</div>

      <div class="progress-container" id="bar">
        <div class="progress" id="prog"></div>
      </div>
    </div>

    <button onclick="togglePlay()">⏯</button>

    <div class="time" id="time">0:00</div>

  </div>

</div>

<script>

let audio = new Audio();
let list = [];
let index = 0;
let artist = "";

/* TITLE HANDLER */
function setTitle(song=null){
  if(song){
    document.title = `${song} - MusicPlayer`;
  } else if(artist){
    document.title = `${artist} - MusicPlayer`;
  } else {
    document.title = "MusicPlayer";
  }
}

/* PLAY */
function playSong(l,i,a){
  list = l;
  index = i;
  artist = a;

  let s = l[i];

  audio.src = `./${a}/${s.file}`;
  audio.play();

  document.getElementById("player").style.display = "block";

  now.innerText = s.title;
  cover.src = `./${a}/${s.image}`;

  setTitle(s.title);
}

/* PLAY/PAUSE */
function togglePlay(){
  audio.paused ? audio.play() : audio.pause();
}

/* SYNC */
audio.addEventListener("timeupdate",()=>{

  let pct = (audio.currentTime / audio.duration) * 100;

  prog.style.width = pct + "%";

  let m = Math.floor(audio.currentTime / 60);
  let s = Math.floor(audio.currentTime % 60);

  time.innerText = `${m}:${s < 10 ? "0" : ""}${s}`;
});

/* SEEK */
bar.onclick = e => {
  let r = bar.getBoundingClientRect();
  let p = (e.clientX - r.left) / r.width;
  audio.currentTime = p * audio.duration;
};

/* ROUTING */
const params = new URLSearchParams(location.search);
const artistName = params.get("name");

/* HOME */
if(!artistName){

  setTitle();

  fetch("artist.json")
    .then(r=>r.json())
    .then(artists=>{

      artists.forEach(name=>{

        fetch(`./${name}/config.json`)
          .then(r=>r.json())
          .then(data=>{

            let card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
              <img src="./${name}/${data.image}">
              <div>${data.artist}</div>
            `;

            card.onclick = () => location.href = `?name=${name}`;

            grid.appendChild(card);
          });

      });

    });

}

/* ARTIST */
else{

  grid.style.display = "none";
  songs.style.display = "grid";

  fetch(`./${artistName}/config.json`)
    .then(r=>r.json())
    .then(data=>{

      document.title = `${data.artist} - MusicPlayer`;

      data.songs.forEach((s,i)=>{

        let el = document.createElement("div");
        el.className = "song";

        el.innerHTML = `
          <img src="./${artistName}/${s.image}">
          <div>${s.title}</div>
        `;

        el.onclick = () => playSong(data.songs,i,artistName);

        songs.appendChild(el);
      });

    });

}

</script>

</body>
</html>
