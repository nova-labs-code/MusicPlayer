<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicPlayer</title>

<link rel="stylesheet" href="./style.css">

<style>
  /* safety layer so nothing leaks */
  html, body{
    margin:0;
    padding:0;
    background:#0f0f0f;
    overflow-x:hidden;
  }

  canvas#visualizer{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    display:none;
    z-index:1;
    pointer-events:none;
  }

  .player{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
  }

  .fullscreen-ui{
    max-width:100vw;
  }

  .ui{
    max-width:100vw;
  }

  button{
    touch-action:manipulation;
  }
</style>

</head>

<body>

<!-- VISUALIZER -->
<canvas id="visualizer"></canvas>

<!-- NAV -->
<div id="nav">
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="goBack()">🎤 Back</button>
</div>

<!-- TITLE -->
<h1 id="title">MusicPlayer</h1>

<!-- SONG SEARCH -->
<input id="songSearch" placeholder="Search songs..." />

<!-- SONG GRID -->
<div id="songs" class="songs"></div>

<!-- PLAYER -->
<div class="player" id="player">

  <!-- MINI -->
  <div class="ui">

    <img id="cover">

    <div style="flex:1">
      <div id="now">Not Playing</div>

      <div class="progress-container" id="barMini">
        <div class="progress" id="progMini"></div>
      </div>
    </div>

    <button onclick="prevSong()">⏮</button>
    <button onclick="togglePlay()">⏯</button>
    <button onclick="nextSong()">⏭</button>

    <button id="visualBtn" onclick="toggleVisualizer()">🎛️</button>

    <button onclick="toggleShuffle()">🔀</button>
    <button onclick="toggleLoop()">🔁</button>

    <button onclick="toggleFullscreen()">⛶</button>

    <div id="time">0:00</div>
  </div>

  <!-- FULLSCREEN -->
  <div class="fullscreen-ui">

    <img id="coverBig">

    <div id="songTitle"></div>
    <div id="artistName"></div>

    <div class="controls">

      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="nextSong()">⏭</button>

      <button id="visualBtnFS" onclick="toggleVisualizer()">🎛️</button>

      <button onclick="toggleShuffle()">🔀</button>
      <button onclick="toggleLoop()">🔁</button>

      <button onclick="toggleFullscreen()">⛶</button>

    </div>

    <div class="full-progress" id="barFull">
      <div class="progress" id="progFull"></div>
    </div>

  </div>

</div>

<!-- AUDIO -->
<audio id="audio"></audio>

<script src="./main.js"></script>

</body>
</html>
