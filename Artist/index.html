<!DOCTYPE html>
<html>
<head>
  <title>Artist Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    h1 {
      padding: 20px;
      margin: 0;
    }

    /* 🏠 ARTIST GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.04);
      background: #2a2a2a;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .name {
      margin-top: 8px;
      font-size: 14px;
    }

    /* 🎵 SONG GRID */
    .songs {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .song {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .song:hover {
      background: #2a2a2a;
      transform: scale(1.03);
    }

    .song img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background: #333;
    }

    .song-title {
      margin-top: 8px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>

<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<script>
const DEFAULT_IMAGE =
  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAQAAAAAYLlVAAA...";

/* 🧠 IMAGE RESOLVER (song → pfp → fallback) */
function resolveImage(songImage, artistName) {
  if (songImage && songImage.trim() !== "") {
    return songImage;
  }

  const pfp = `${artistName}/pfp.png`;

  return pfp || DEFAULT_IMAGE;
}

/* 📌 ROUTE */
const params = new URLSearchParams(window.location.search);
const artistName = params.get("Name");

/* 🏠 ARTIST GRID MODE */
if (!artistName) {

  const artists = ["Alex Warren", "NeonEcho"];

  artists.forEach(name => {

    fetch(`${name}/config.json`)
      .then(res => res.json())
      .then(data => {

        const card = document.createElement("div");
        card.className = "card";

        const pfp = `${name}/pfp.png`;

        card.innerHTML = `
          <img src="${pfp}">
          <div class="name">${data.artist}</div>
        `;

        card.onclick = () => {
          window.location.href = `?Name=${encodeURIComponent(name)}`;
        };

        document.getElementById("grid").appendChild(card);

      });

  });

}

/* 🎤 SONG GRID MODE */
else {

  document.getElementById("grid").style.display = "none";

  const songsDiv = document.getElementById("songs");
  songsDiv.style.display = "grid";

  fetch(`${artistName}/config.json`)
    .then(res => res.json())
    .then(data => {

      document.getElementById("title").innerText = data.artist;

      data.songs.forEach(song => {

        const card = document.createElement("div");
        card.className = "song";

        const img = resolveImage(song.image, artistName);

        card.innerHTML = `
          <img src="${img}">
          <div class="song-title">${song.title}</div>
        `;

        card.onclick = () => {
          new Audio(`${artistName}/${song.file}`).play();
        };

        songsDiv.appendChild(card);

      });

    });

}
</script>

</body>
</html>
