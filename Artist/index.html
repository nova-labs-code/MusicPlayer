<!DOCTYPE html>
<html>
<head>
<title>MusicPlayer</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

h1{
  padding:20px;
  margin:0;
}

/* GRID */
.grid,.songs{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:16px;
  padding:20px;
}

.card,.song{
  background:#1c1c1c;
  border-radius:10px;
  padding:10px;
  text-align:center;
  cursor:pointer;
}

img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

/* PLAYER */
.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#181818;
  display:none;
  z-index:999;
}

/* UI */
.ui{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
}

#cover{
  width:44px;
  height:44px;
  border-radius:6px;
}

/* controls */
button{
  background:none;
  border:none;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* progress */
.progress-container{
  flex:1;
  height:4px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  cursor:pointer;
}

.progress{
  height:100%;
  width:0%;
  background:white;
}

.time{
  width:70px;
  font-size:12px;
  text-align:right;
}

/* FULLSCREEN */
.player.fullscreen{
  top:0;
  height:100vh;
  background:radial-gradient(circle,#1a1a1a,#000);
}

.fullscreen-ui{
  display:none;
  height:100%;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:30px;
  box-sizing:border-box;
}

.player.fullscreen .fullscreen-ui{
  display:flex;
}

#coverBig{
  width:260px;
  height:260px;
  border-radius:18px;
  object-fit:cover;
}

.full-controls button{
  font-size:26px;
  margin:0 10px;
}

.progress-container.big{
  width:min(700px,85vw);
  height:4px;
}

.exit{
  position:absolute;
  top:15px;
  right:15px;
  background:#222;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

/* PiP */
video{
  position:fixed;
  width:1px;
  height:1px;
  opacity:0;
}
</style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>

<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<div class="player" id="player">

  <div class="ui">
    <img id="cover">

    <div style="flex:1">
      <div id="now">Not Playing</div>

      <div class="progress-container" id="bar">
        <div class="progress" id="prog"></div>
      </div>
    </div>

    <button onclick="togglePlay()">⏯</button>
    <button onclick="togglePiP()">🪟</button>
    <button onclick="toggleFullscreen()">⛶</button>

    <div class="time" id="time">0:00</div>
  </div>

  <div class="fullscreen-ui">
    <div class="exit" onclick="exitFullscreen()">✕ Exit</div>

    <img id="coverBig">

    <div id="songTitle"></div>
    <div id="artistName"></div>

    <div class="full-controls">
      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="nextSong()">⏭</button>
    </div>

    <div class="progress-container big" id="barFull">
      <div class="progress" id="progFull"></div>
    </div>

    <div class="time" id="timeFull">0:00</div>
  </div>
</div>

<video id="pip"></video>

<script>

let audio=new Audio();
let pip=document.getElementById("pip");

let list=[],index=0,artist="";

/* PLAY */
function playSong(l,i,a){
  list=l;
  index=i;
  artist=a;

  let s=l[i];

  audio.src=`./${a}/${s.file}`;
  pip.src=audio.src;

  audio.play();
  pip.play().catch(()=>{});

  document.getElementById("player").style.display="block";

  now.innerText=s.title;
  cover.src=`./${a}/${s.image}`;
  coverBig.src=`./${a}/${s.image}`;

  songTitle.innerText=s.title;
  artistName.innerText=a;

  document.title=`${s.title} - MusicPlayer`;
}

/* CONTROLS */
function togglePlay(){
  if(audio.paused){
    audio.play();
    pip.play().catch(()=>{});
  }else{
    audio.pause();
    pip.pause();
  }
}

function nextSong(){
  if(index<list.length-1)
    playSong(list,index+1,artist);
}

function prevSong(){
  if(audio.currentTime>5){
    audio.currentTime=0;
    pip.currentTime=0;
    return;
  }
  if(index>0)
    playSong(list,index-1,artist);
}

/* FULLSCREEN */
function toggleFullscreen(){
  let p=player;

  if(!p.classList.contains("fullscreen")){
    p.classList.add("fullscreen");
    document.documentElement.requestFullscreen?.();
  }else{
    exitFullscreen();
  }
}

function exitFullscreen(){
  player.classList.remove("fullscreen");
  document.exitFullscreen?.();
}

/* PiP */
async function togglePiP(){
  try{
    if(document.pictureInPictureElement){
      await document.exitPictureInPicture();
    }else{
      pip.src=audio.src;
      pip.currentTime=audio.currentTime;
      await pip.play();
      await pip.requestPictureInPicture();
    }
  }catch(e){}
}

/* SYNC */
audio.addEventListener("timeupdate",()=>{
  pip.currentTime=audio.currentTime;

  let pct=(audio.currentTime/audio.duration)*100;

  prog.style.width=pct+"%";
  progFull.style.width=pct+"%";

  let m=Math.floor(audio.currentTime/60);
  let s=Math.floor(audio.currentTime%60);

  let t=`${m}:${s<10?"0":""}${s}`;

  time.innerText=t;
  timeFull.innerText=t;
});

/* SEEK */
bar.onclick=e=>{
  let r=bar.getBoundingClientRect();
  let p=(e.clientX-r.left)/r.width;
  audio.currentTime=p*audio.duration;
  pip.currentTime=audio.currentTime;
};

barFull.onclick=e=>{
  let r=barFull.getBoundingClientRect();
  let p=(e.clientX-r.left)/r.width;
  audio.currentTime=p*audio.duration;
  pip.currentTime=audio.currentTime;
};

/* ROUTING FIXED (THIS WAS MISSING BEFORE) */
const params=new URLSearchParams(location.search);
const artistName=params.get("name");

/* HOME */
if(!artistName){

  document.title="MusicPlayer";

  fetch("artist.json")
    .then(r=>r.json())
    .then(artists=>{

      artists.forEach(name=>{

        fetch(`./${name}/config.json`)
          .then(r=>r.json())
          .then(data=>{

            let card=document.createElement("div");
            card.className="card";

            card.innerHTML=`
              <img src="./${name}/${data.image}">
              <div>${data.artist}</div>
            `;

            card.onclick=()=>location.href=`?name=${name}`;

            grid.appendChild(card);
          });

      });

    });

}

/* ARTIST PAGE */
else{

  grid.style.display="none";
  songs.style.display="grid";

  fetch(`./${artistName}/config.json`)
    .then(r=>r.json())
    .then(data=>{

      document.title=`${data.artist} - MusicPlayer`;

      data.songs.forEach((s,i)=>{

        let el=document.createElement("div");
        el.className="song";

        el.innerHTML=`
          <img src="./${artistName}/${s.image}">
          <div>${s.title}</div>
        `;

        el.onclick=()=>playSong(data.songs,i,artistName);

        songs.appendChild(el);
      });

    });

}

</script>

</body>
</html>
