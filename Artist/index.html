<!DOCTYPE html>
<html>
<head>
  <title>Artist Hub</title>

  <style>
    :root {
      --accent: #ffffff;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    h1 {
      padding: 20px;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.04);
      background: #2a2a2a;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .name {
      margin-top: 8px;
      font-size: 14px;
    }

    .songs {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .song {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .song:hover {
      transform: scale(1.03);
      background: #2a2a2a;
    }

    .song img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .song-title {
      margin-top: 8px;
      font-size: 13px;
    }

    /* PLAYER */
    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      display: none;
      align-items: center;
      padding: 10px;
      gap: 10px;
      z-index: 999;
    }

    .player img {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      object-fit: cover;
    }

    .controls button {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .progress-container {
      flex: 1;
      height: 6px;
      background: #333;
      border-radius: 5px;
      cursor: pointer;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 5px;
    }

    .time {
      font-size: 12px;
      width: 90px;
      text-align: right;
    }

    /* FULLSCREEN */
    .player.fullscreen {
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      position: fixed;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 70%);
      gap: 22px;
      padding: 40px;
    }

    .player.fullscreen img {
      width: 260px;
      height: 260px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .player.fullscreen .progress-container {
      width: 60%;
      max-width: 500px;
    }
  </style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>

<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<!-- PLAYER -->
<div class="player" id="player">
  <img id="cover">

  <div style="flex:1">
    <div id="nowPlaying">Not Playing</div>

    <div class="progress-container" id="progressContainer">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="prevSong()">⏮</button>
    <button onclick="togglePlay()">⏯</button>
    <button onclick="nextSong()">⏭</button>
    <button onclick="toggleFullscreen()">⛶</button>
  </div>

  <div class="time" id="time">0:00</div>
</div>

<script>

let audio = new Audio();
let currentList = [];
let currentIndex = 0;
let currentArtist = "";

/* THEME */
function applyTheme(theme) {
  if (!theme) return;
  document.body.style.background = theme.bg || "#0f0f0f";
  document.documentElement.style.setProperty("--accent", theme.accent || "#ffffff");
}

/* PLAY SONG */
function playSong(list, index, artist) {
  currentList = list;
  currentIndex = index;
  currentArtist = artist;

  const song = list[index];

  audio.src = `./${artist}/${song.file}`;
  audio.play();

  document.getElementById("player").style.display = "flex";
  document.getElementById("nowPlaying").innerText = song.title;
  document.getElementById("cover").src = `./${artist}/${song.image}`;
}

/* BACK (5s rule) */
function prevSong() {
  if (audio.currentTime > 5) {
    audio.currentTime = 0;
    audio.play();
    return;
  }

  if (currentIndex > 0) {
    playSong(currentList, currentIndex - 1, currentArtist);
  }
}

/* CONTROLS */
function togglePlay() {
  if (audio.paused) audio.play();
  else audio.pause();
}

function nextSong() {
  if (currentIndex < currentList.length - 1) {
    playSong(currentList, currentIndex + 1, currentArtist);
  }
}

/* FULLSCREEN */
function toggleFullscreen() {
  const player = document.getElementById("player");

  if (!player.classList.contains("fullscreen")) {
    player.classList.add("fullscreen");
    document.documentElement.requestFullscreen?.();
  } else {
    player.classList.remove("fullscreen");
    document.exitFullscreen?.();
  }
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    document.getElementById("player").classList.remove("fullscreen");
  }
});

/* PROGRESS */
audio.addEventListener("timeupdate", () => {
  const bar = document.getElementById("progress");
  const percent = (audio.currentTime / audio.duration) * 100;
  bar.style.width = percent + "%";

  const m = Math.floor(audio.currentTime / 60);
  const s = Math.floor(audio.currentTime % 60);

  document.getElementById("time").innerText =
    `${m}:${s < 10 ? "0" : ""}${s}`;
});

/* SEEK */
document.getElementById("progressContainer").onclick = (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
};

/* ROUTE */
const params = new URLSearchParams(window.location.search);
const artistName = params.get("name");

/* ARTIST MODE */
if (!artistName) {

  fetch("artist.json")
    .then(res => res.json())
    .then(artists => {

      artists.forEach(name => {

        fetch(`./${name}/config.json`)
          .then(res => res.json())
          .then(data => {

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
              <img src="./${name}/${data.image}">
              <div class="name">${data.artist}</div>
            `;

            card.onclick = () => {
              window.location.href = `?name=${encodeURIComponent(name)}`;
            };

            document.getElementById("grid").appendChild(card);

          });

      });

    });

}

/* SONG MODE */
else {

  document.getElementById("grid").style.display = "none";
  const songsDiv = document.getElementById("songs");
  songsDiv.style.display = "grid";

  fetch(`./${artistName}/config.json`)
    .then(res => res.json())
    .then(data => {

      applyTheme(data.theme);
      document.getElementById("title").innerText = data.artist;

      data.songs.forEach((song, i) => {

        const el = document.createElement("div");
        el.className = "song";

        el.innerHTML = `
          <img src="./${artistName}/${song.image}">
          <div class="song-title">${song.title}</div>
        `;

        el.onclick = () => playSong(data.songs, i, artistName);

        songsDiv.appendChild(el);

      });

    });

}

</script>

</body>
</html>
