<!DOCTYPE html>
<html>
<head>
<title>MusicPlayer</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}

/* GRID */
.grid,.songs{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:16px;
  padding:20px;
}

.card,.song{
  background:#1c1c1c;
  border-radius:10px;
  padding:10px;
  text-align:center;
  cursor:pointer;
}

img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

/* PLAYER */
.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#181818;
  display:none;
  z-index:999;
}

/* MINI BAR */
.ui{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
}

#cover{
  width:44px;
  height:44px;
  border-radius:6px;
}

/* controls */
button{
  background:none;
  border:none;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* MINI PROGRESS */
.progress-container{
  flex:1;
  height:4px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  cursor:pointer;
}

.progress{
  height:100%;
  width:0%;
  background:white;
}

.time{
  width:70px;
  font-size:12px;
  text-align:right;
}

/* FULLSCREEN MODE */
.player.fullscreen{
  top:0;
  height:100vh;
  background:radial-gradient(circle,#1a1a1a,#000);
}

/* hide mini bar in fullscreen */
.player.fullscreen .ui{
  display:none;
}

/* FULLSCREEN LAYOUT */
.fullscreen-ui{
  display:none;
  height:100%;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  padding:30px;
  box-sizing:border-box;
}

.player.fullscreen .fullscreen-ui{
  display:flex;
}

/* CENTER IMAGE */
#coverBig{
  width:260px;
  height:260px;
  border-radius:18px;
  object-fit:cover;
}

/* CONTROLS UNDER IMAGE */
.full-controls{
  display:flex;
  gap:20px;
  align-items:center;
}

.full-controls button{
  font-size:28px;
}

/* FULLSCREEN PROGRESS AT BOTTOM ONLY */
.full-progress{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,85vw);
  height:4px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  cursor:pointer;
}

.full-progress .progress{
  height:100%;
  width:0%;
  background:white;
}
</style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>

<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<div class="player" id="player">

  <!-- MINI MODE -->
  <div class="ui">

    <img id="cover">

    <div style="flex:1">
      <div id="now">Not Playing</div>

      <div class="progress-container" id="barMini">
        <div class="progress" id="progMini"></div>
      </div>
    </div>

    <button onclick="togglePlay()">⏯</button>
    <button onclick="toggleFullscreen()">⛶</button>

    <div class="time" id="time">0:00</div>

  </div>

  <!-- FULLSCREEN MODE -->
  <div class="fullscreen-ui">

    <img id="coverBig">

    <div id="songTitle"></div>
    <div id="artistName"></div>

    <div class="full-controls">
      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="nextSong()">⏭</button>
    </div>

    <div class="full-progress" id="barFull">
      <div class="progress" id="progFull"></div>
    </div>

  </div>

</div>

<script>

let audio = new Audio();
let list=[], index=0, artist="";

/* PLAY */
function playSong(l,i,a){
  list=l;
  index=i;
  artist=a;

  let s=l[i];

  audio.src=`./${a}/${s.file}`;
  audio.play();

  player.style.display="block";

  now.innerText=s.title;
  cover.src=`./${a}/${s.image}`;
  coverBig.src=`./${a}/${s.image}`;

  songTitle.innerText=s.title;
  artistName.innerText=a;

  document.title=`${s.title} - MusicPlayer`;
}

/* CONTROLS */
function togglePlay(){
  audio.paused ? audio.play() : audio.pause();
}

function nextSong(){
  if(index<list.length-1)
    playSong(list,index+1,artist);
}

function prevSong(){
  if(index>0)
    playSong(list,index-1,artist);
}

/* FULLSCREEN TOGGLE */
function toggleFullscreen(){
  let p=player;

  if(!p.classList.contains("fullscreen")){
    p.classList.add("fullscreen");
    document.documentElement.requestFullscreen?.();
  }else{
    p.classList.remove("fullscreen");
    document.exitFullscreen?.();
  }
}

/* SYNC */
audio.addEventListener("timeupdate",()=>{

  let pct=(audio.currentTime/audio.duration)*100;

  progMini.style.width=pct+"%";
  progFull.style.width=pct+"%";

  let m=Math.floor(audio.currentTime/60);
  let s=Math.floor(audio.currentTime%60);

  time.innerText=`${m}:${s<10?"0":""}${s}`;
});

/* SEEK MINI */
barMini.onclick=e=>{
  let r=barMini.getBoundingClientRect();
  let p=(e.clientX-r.left)/r.width;
  audio.currentTime=p*audio.duration;
};

/* SEEK FULL */
barFull.onclick=e=>{
  let r=barFull.getBoundingClientRect();
  let p=(e.clientX-r.left)/r.width;
  audio.currentTime=p*audio.duration;
};

/* ROUTING */
const params=new URLSearchParams(location.search);
const artistName=params.get("name");

if(!artistName){

  document.title="MusicPlayer";

  fetch("artist.json")
    .then(r=>r.json())
    .then(artists=>{

      artists.forEach(name=>{

        fetch(`./${name}/config.json`)
          .then(r=>r.json())
          .then(data=>{

            let card=document.createElement("div");
            card.className="card";

            card.innerHTML=`
              <img src="./${name}/${data.image}">
              <div>${data.artist}</div>
            `;

            card.onclick=()=>location.href=`?name=${name}`;

            grid.appendChild(card);
          });

      });

    });

}else{

  grid.style.display="none";
  songs.style.display="grid";

  fetch(`./${artistName}/config.json`)
    .then(r=>r.json())
    .then(data=>{

      document.title=`${data.artist} - MusicPlayer`;

      data.songs.forEach((s,i)=>{

        let el=document.createElement("div");
        el.className="song";

        el.innerHTML=`
          <img src="./${artistName}/${s.image}">
          <div>${s.title}</div>
        `;

        el.onclick=()=>playSong(data.songs,i,artistName);

        songs.appendChild(el);
      });

    });

}

</script>

</body>
</html>
