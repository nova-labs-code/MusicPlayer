<!DOCTYPE html>
<html>
<head>
  <title>Artist Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    h1 {
      padding: 20px;
      margin: 0;
    }

    /* 🏠 ARTIST GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      object-fit: cover;
    }

    .name {
      margin-top: 8px;
      font-size: 14px;
    }

    /* 🎵 SONG GRID */
    .songs {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .song {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }

    .song img {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
    }

    .song-title {
      margin-top: 8px;
      font-size: 13px;
    }

    /* 🎧 PLAYER BAR */
    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      display: none;
      align-items: center;
      padding: 10px;
      gap: 10px;
    }

    .player img {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      object-fit: cover;
    }

    .controls button {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .progress-container {
      flex: 1;
      height: 5px;
      background: #333;
      border-radius: 5px;
      cursor: pointer;
      position: relative;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #1db954;
      border-radius: 5px;
    }

    .time {
      font-size: 12px;
      width: 90px;
      text-align: right;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/music-metadata-browser/dist/music-metadata-browser.min.js"></script>
</head>

<body>

<h1 id="title">🎧 Artists</h1>

<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<!-- 🎧 PLAYER -->
<div class="player" id="player">
  <img id="cover">
  <div style="flex:1">
    <div id="nowPlaying">Not Playing</div>

    <div class="progress-container" id="progressContainer">
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="prevSong()">⏮</button>
    <button onclick="togglePlay()">⏯</button>
    <button onclick="nextSong()">⏭</button>
  </div>

  <div class="time" id="time">0:00</div>
</div>

<script>
const DEFAULT_IMAGE =
  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAQAAAAAYLlVAAA...";

let audio = new Audio();
let currentList = [];
let currentIndex = 0;
let isPlaying = false;

function resolveFallback(img, artist) {
  return img || `${artist}/pfp.png` || DEFAULT_IMAGE;
}

/* -------------------------
   🧠 MP3 ART LOADER
------------------------- */
async function getMp3Image(path, fallback) {
  try {
    const file = await fetch(path);
    const buffer = await file.arrayBuffer();
    const meta = await musicMetadata.parseBlob(new Blob([buffer]));

    const pic = meta.common.picture?.[0];
    if (pic) {
      const blob = new Blob([pic.data], { type: pic.format });
      return URL.createObjectURL(blob);
    }
  } catch (e) {}

  return fallback;
}

/* -------------------------
   🎧 PLAYER CONTROLS
------------------------- */
function playSong(list, index, artist) {
  currentList = list;
  currentIndex = index;

  const song = list[index];

  audio.src = `${artist}/${song.file}`;
  audio.play();
  isPlaying = true;

  document.getElementById("player").style.display = "flex";
  document.getElementById("nowPlaying").innerText = song.title;

  updateCover(song, artist);
}

async function updateCover(song, artist) {
  let img = song.image;

  if (!img) {
    img = await getMp3Image(`${artist}/${song.file}`, `${artist}/pfp.png`);
  }

  document.getElementById("cover").src = img;
}

function togglePlay() {
  if (audio.paused) audio.play();
  else audio.pause();
}

function nextSong() {
  if (currentIndex < currentList.length - 1) {
    playSong(currentList, currentIndex + 1, currentArtist);
  }
}

function prevSong() {
  if (currentIndex > 0) {
    playSong(currentList, currentIndex - 1, currentArtist);
  }
}

/* -------------------------
   📊 PROGRESS BAR
------------------------- */
audio.addEventListener("timeupdate", () => {
  const progress = document.getElementById("progress");

  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";

  const min = Math.floor(audio.currentTime / 60);
  const sec = Math.floor(audio.currentTime % 60);

  document.getElementById("time").innerText =
    `${min}:${sec < 10 ? "0" : ""}${sec}`;
});

/* 🖱️ DRAG SEEK */
document.getElementById("progressContainer").onclick = (e) => {
  const rect = e.target.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
};

/* -------------------------
   📌 ROUTING
------------------------- */
const params = new URLSearchParams(window.location.search);
const artistName = params.get("Name");

/* -------------------------
   🏠 ARTIST GRID
------------------------- */
if (!artistName) {

  const artists = ["Alex Warren", "NeonEcho"];

  artists.forEach(name => {

    fetch(`${name}/config.json`)
      .then(res => res.json())
      .then(data => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${name}/pfp.png">
          <div class="name">${data.artist}</div>
        `;

        card.onclick = () => {
          window.location.href = `?Name=${encodeURIComponent(name)}`;
        };

        document.getElementById("grid").appendChild(card);

      });

  });

}

/* -------------------------
   🎤 SONG GRID
------------------------- */
else {

  document.getElementById("grid").style.display = "none";
  const songsDiv = document.getElementById("songs");
  songsDiv.style.display = "grid";

  let currentArtist = artistName;

  fetch(`${artistName}/config.json`)
    .then(res => res.json())
    .then(data => {

      document.getElementById("title").innerText = data.artist;

      data.songs.forEach((song, i) => {

        const card = document.createElement("div");
        card.className = "song";

        const img = song.image || `${artistName}/pfp.png`;

        card.innerHTML = `
          <img src="${img}">
          <div class="song-title">${song.title}</div>
        `;

        card.onclick = () => {
          playSong(data.songs, i, artistName);
        };

        songsDiv.appendChild(card);

      });

    });

}
</script>

</body>
</html>
