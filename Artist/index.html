<!DOCTYPE html>
<html>
<head>
  <title>MusicPlayer</title>

  <style>
    :root {
      --accent: #ffffff;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }

    h1 {
      padding: 20px;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.04);
      background: #2a2a2a;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .name {
      margin-top: 8px;
      font-size: 14px;
    }

    .songs {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .song {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .song:hover {
      transform: scale(1.03);
      background: #2a2a2a;
    }

    .song img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .song-title {
      margin-top: 8px;
      font-size: 13px;
    }

    /* PLAYER */
    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      display: none;
      z-index: 999;
    }

    /* MINI */
    .mini-ui {
      display: flex;
      align-items: center;
      padding: 8px;
      gap: 10px;
    }

    #cover-mini {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
    }

    .controls button {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    /* thinner progress */
    .progress-container {
      flex: 1;
      height: 4px;
      background: #333;
      border-radius: 5px;
      cursor: pointer;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: var(--accent);
    }

    .time {
      font-size: 12px;
      width: 70px;
      text-align: right;
    }

    /* FULLSCREEN */
    .fullscreen-ui {
      display: none;
      height: 100vh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 40px;
    }

    .player.fullscreen {
      top: 0;
      bottom: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1a1a, #000);
    }

    .player.fullscreen .mini-ui {
      display: none;
    }

    .player.fullscreen .fullscreen-ui {
      display: flex;
    }

    #cover-full {
      width: 260px;
      height: 260px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      object-fit: cover;
    }

    #fullTitle {
      font-size: 22px;
    }

    #fullArtist {
      opacity: 0.7;
    }

    .full-controls button {
      font-size: 26px;
      margin: 0 10px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .progress-container.big {
      width: 55%;
      max-width: 480px;
      height: 6px;
    }
  </style>
</head>

<body>

<h1 id="title">🎧 Artists</h1>
<div id="grid" class="grid"></div>
<div id="songs" class="songs"></div>

<!-- PLAYER -->
<div class="player" id="player">

  <!-- MINI -->
  <div class="mini-ui">
    <img id="cover-mini">

    <div style="flex:1">
      <div id="nowPlaying">Not Playing</div>

      <div class="progress-container" id="progressContainer">
        <div class="progress" id="progress"></div>
      </div>
    </div>

    <div class="controls">
      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="nextSong()">⏭</button>
      <button onclick="toggleFullscreen()">⛶</button>
      <button onclick="togglePiP()">🪟</button>
    </div>

    <div class="time" id="time">0:00</div>
  </div>

  <!-- FULL -->
  <div class="fullscreen-ui">
    <img id="cover-full">
    <div id="fullTitle">Not Playing</div>
    <div id="fullArtist"></div>

    <div class="full-controls">
      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()">⏯</button>
      <button onclick="nextSong()">⏭</button>
    </div>

    <div class="progress-container big" id="progressContainerFull">
      <div class="progress" id="progressFull"></div>
    </div>

    <div class="time" id="timeFull">0:00</div>
  </div>
</div>

<script>
let audio = new Audio();
let currentList = [];
let currentIndex = 0;
let currentArtist = "";

/* TITLE UPDATE */
function setTabTitle(artist) {
  document.title = `MusicPlayer - ${artist}`;
}

/* PLAY */
function playSong(list, index, artist) {
  currentList = list;
  currentIndex = index;
  currentArtist = artist;

  const song = list[index];

  audio.src = `./${artist}/${song.file}`;
  audio.play();

  document.getElementById("player").style.display = "block";

  document.getElementById("nowPlaying").innerText = song.title;
  document.getElementById("cover-mini").src = `./${artist}/${song.image}`;

  document.getElementById("cover-full").src = `./${artist}/${song.image}`;
  document.getElementById("fullTitle").innerText = song.title;
  document.getElementById("fullArtist").innerText = artist;

  setTabTitle(artist);
}

/* CONTROLS */
function togglePlay() {
  audio.paused ? audio.play() : audio.pause();
}

function prevSong() {
  if (audio.currentTime > 5) {
    audio.currentTime = 0;
    return;
  }
  if (currentIndex > 0) {
    playSong(currentList, currentIndex - 1, currentArtist);
  }
}

function nextSong() {
  if (currentIndex < currentList.length - 1) {
    playSong(currentList, currentIndex + 1, currentArtist);
  }
}

/* FULLSCREEN */
function toggleFullscreen() {
  const player = document.getElementById("player");

  if (!player.classList.contains("fullscreen")) {
    player.classList.add("fullscreen");
    document.documentElement.requestFullscreen?.();
  } else {
    player.classList.remove("fullscreen");
    document.exitFullscreen?.();
  }
}

/* PiP */
async function togglePiP() {
  try {
    if (!document.pictureInPictureElement) {
      await audio.requestPictureInPicture?.();
    } else {
      await document.exitPictureInPicture?.();
    }
  } catch (e) {
    console.log("PiP not supported for audio in this browser");
  }
}

/* PROGRESS */
audio.addEventListener("timeupdate", () => {
  const percent = (audio.currentTime / audio.duration) * 100;

  document.getElementById("progress").style.width = percent + "%";
  document.getElementById("progressFull").style.width = percent + "%";

  const m = Math.floor(audio.currentTime / 60);
  const s = Math.floor(audio.currentTime % 60);
  const t = `${m}:${s < 10 ? "0" : ""}${s}`;

  document.getElementById("time").innerText = t;
  document.getElementById("timeFull").innerText = t;
});

/* SEEK */
document.getElementById("progressContainer").onclick = (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
};

/* ROUTE */
const params = new URLSearchParams(window.location.search);
const artistName = params.get("name");

/* HOME */
if (!artistName) {
  fetch("artist.json")
    .then(r => r.json())
    .then(artists => {
      artists.forEach(name => {
        fetch(`./${name}/config.json`)
          .then(r => r.json())
          .then(data => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <img src="./${name}/${data.image}">
              <div class="name">${data.artist}</div>
            `;
            card.onclick = () => {
              window.location.href = `?name=${encodeURIComponent(name)}`;
            };
            document.getElementById("grid").appendChild(card);
          });
      });
    });
}

/* ARTIST */
else {
  document.getElementById("grid").style.display = "none";
  document.getElementById("songs").style.display = "grid";

  fetch(`./${artistName}/config.json`)
    .then(r => r.json())
    .then(data => {
      setTabTitle(data.artist);

      document.getElementById("title").innerText = data.artist;

      data.songs.forEach((song, i) => {
        const el = document.createElement("div");
        el.className = "song";
        el.innerHTML = `
          <img src="./${artistName}/${song.image}">
          <div class="song-title">${song.title}</div>
        `;
        el.onclick = () => playSong(data.songs, i, artistName);
        document.getElementById("songs").appendChild(el);
      });
    });
}
</script>

</body>
</html>
