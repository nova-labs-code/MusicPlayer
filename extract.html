<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MP3 Album Art Extractor</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 40px;
  }

  img {
    max-width: 320px;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #output {
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.9;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>🎵 MP3 Album Art Extractor</h1>
<input type="file" id="fileInput" accept=".mp3">
<div id="output">Waiting for file...</div>

<script>
window.addEventListener("load", () => {
  const input = document.getElementById("fileInput");
  const output = document.getElementById("output");

  function log(msg) {
    console.log(msg);
    output.textContent += msg + "\n";
  }

  input.addEventListener("change", async () => {
    output.textContent = "";

    const file = input.files[0];
    if (!file) return;

    log("📂 File: " + file.name);
    log("⏳ Reading...");

    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    // Check ID3 header
    if (
      view.getUint8(0) !== 0x49 ||
      view.getUint8(1) !== 0x44 ||
      view.getUint8(2) !== 0x33
    ) {
      log("❌ No ID3 tag found");
      return;
    }

    const version = view.getUint8(3);
    log("🎚 ID3 version: " + version);

    const tagSize =
      ((view.getUint8(6) & 0x7f) << 21) |
      ((view.getUint8(7) & 0x7f) << 14) |
      ((view.getUint8(8) & 0x7f) << 7) |
      (view.getUint8(9) & 0x7f);

    let offset = 10;

    while (offset < tagSize) {
      let frameID = String.fromCharCode(
        view.getUint8(offset),
        view.getUint8(offset + 1),
        view.getUint8(offset + 2),
        view.getUint8(offset + 3)
      );

      if (!frameID.trim()) break;

      let frameSize;

      if (version === 4) {
        frameSize =
          ((view.getUint8(offset + 4) & 0x7f) << 21) |
          ((view.getUint8(offset + 5) & 0x7f) << 14) |
          ((view.getUint8(offset + 6) & 0x7f) << 7) |
          (view.getUint8(offset + 7) & 0x7f);
      } else {
        frameSize =
          (view.getUint8(offset + 4) << 24) |
          (view.getUint8(offset + 5) << 16) |
          (view.getUint8(offset + 6) << 8) |
          view.getUint8(offset + 7);
      }

      log("📦 Frame: " + frameID);

      // 🎯 IMAGE FRAME FOUND
      if (frameID === "APIC") {
        let i = offset + 10;

        i++; // encoding

        // MIME
        let mime = "";
        while (view.getUint8(i) !== 0) {
          mime += String.fromCharCode(view.getUint8(i));
          i++;
        }
        i++;

        i++; // picture type

        // skip description
        while (view.getUint8(i) !== 0 && i < offset + frameSize) i++;
        i++;

        const start = i;
        const end = offset + 10 + frameSize;

        const imageBytes = new Uint8Array(buffer.slice(start, end));

        log("📊 Image bytes: " + imageBytes.length);

        // 🧠 Detect format from magic bytes
        let detectedMime = "image/jpeg";

        if (imageBytes[0] === 0x89 && imageBytes[1] === 0x50) {
          detectedMime = "image/png";
        } else if (imageBytes[0] === 0xFF && imageBytes[1] === 0xD8) {
          detectedMime = "image/jpeg";
        }

        log("🧪 MIME (tag): " + mime);
        log("🧪 MIME (detected): " + detectedMime);

        const blob = new Blob([imageBytes], { type: detectedMime });
        const url = URL.createObjectURL(blob);

        const img = document.createElement("img");
        img.src = url;

        img.onload = () => log("✅ Image rendered");
        img.onerror = () => log("❌ Image failed to render");

        output.appendChild(document.createElement("br"));
        output.appendChild(img);

        return;
      }

      offset += 10 + frameSize;
    }

    log("⚠️ No album art found in file");
  });
});
</script>

</body>
</html>
