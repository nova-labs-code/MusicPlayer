<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MP3 Album Art Extractor</title>

<!-- Library -->
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>

<style>
  body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 40px;
  }

  img {
    max-width: 300px;
    margin-top: 20px;
    border-radius: 10px;
  }

  button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    background: #22c55e;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>🎵 Album Art Extractor</h1>
<input type="file" id="fileInput" accept=".mp3">

<div id="output"></div>
<button id="downloadBtn" style="display:none;">Download Image</button>

<script>
const input = document.getElementById("fileInput");
const output = document.getElementById("output");
const downloadBtn = document.getElementById("downloadBtn");

let imageURL = null;

input.addEventListener("change", () => {
  const file = input.files[0];
  if (!file) return;

  jsmediatags.read(file, {
    onSuccess: function(tag) {
      const picture = tag.tags.picture;

      if (!picture) {
        output.innerHTML = "⚠️ No album art found.";
        downloadBtn.style.display = "none";
        return;
      }

      const { data, format } = picture;

      let byteArray = new Uint8Array(data);
      let blob = new Blob([byteArray], { type: format });

      imageURL = URL.createObjectURL(blob);

      output.innerHTML = `<img src="${imageURL}">`;
      downloadBtn.style.display = "inline-block";
    },

    onError: function(error) {
      output.innerHTML = "❌ Error reading tags.";
      console.error(error);
    }
  });
});

downloadBtn.addEventListener("click", () => {
  if (!imageURL) return;

  const a = document.createElement("a");
  a.href = imageURL;
  a.download = "album-art";
  a.click();
});
</script>

</body>
</html>
